name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar (CMake + Visual Studio instalado)
        run: cmake -B build -A x64 -DWILBO_BUILD_TESTS=ON

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Rodar testes
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter WilboTests.exe | Select-Object -First 1
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Enviar o programa
        uses: actions/upload-artifact@v4
        with:
          name: WilboRig-Windows
          if-no-files-found: error
          path: |
            build/WilboRig_artefacts/Release/Standalone/*.exe
            build/WilboRig_artefacts/Release/VST3/**
